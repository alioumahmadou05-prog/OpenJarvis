<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NxxR Language Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500&family=Noto+Naskh+Arabic:wght@400;600&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
/* NxxR identity: deep black and navy, electric blue. One shell, many rooms. */
:root {
  --void: #03050b;
  --navy: #070d1c;
  --deck: #0a1326;
  --panel: #0e1a33;
  --line: #1c2c4f;
  --ink: #e6eeff;
  --dim: #8495bd;
  --blue: #2f8cff;
  --cyan: #5fd4ff;
  --hot: #c9e6ff;
  --good: #46e0a0;
  --warn: #ffc65c;
  --bad: #ff7d9a;
  --display: "Sora", "Avenir Next", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --cjk: "Noto Sans JP", "Noto Sans SC", "Hiragino Sans", "PingFang SC", sans-serif;
  --arabic: "Noto Naskh Arabic", "Geeza Pro", "Arial", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: radial-gradient(ellipse at 20% -10%, #0c1c3d 0%, var(--void) 55%) fixed; color: var(--ink); font: 15px/1.55 var(--display); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.mono { font-family: var(--mono); }
.dim { color: var(--dim); }
.t-ar { font-family: var(--arabic); direction: rtl; }
.t-cjk { font-family: var(--cjk); }

/* ---------- Shell ---------- */
.shell { min-height: 100%; display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); }
header.top, main { min-width: 0; }
header.top {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
  background: rgba(3,5,11,.82); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
}
.logo { display: flex; align-items: baseline; gap: 8px; font-weight: 700; letter-spacing: .06em; }
.logo b { color: var(--cyan); font-weight: 700; }
.logo span { font-weight: 300; color: var(--dim); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
nav.tabs { display: flex; gap: 2px; flex-wrap: wrap; flex: 1; min-width: 0; }
nav.tabs button { flex: none; }
nav.tabs button { background: transparent; border: 0; color: var(--dim); padding: 7px 11px; border-radius: 10px; font-size: 14px; }
nav.tabs button:hover { color: var(--ink); background: rgba(47,140,255,.08); }
nav.tabs button[aria-current="page"] { color: var(--hot); background: rgba(47,140,255,.16); }
.langpick { display: flex; align-items: center; gap: 8px; }
.sel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 14px; }
.brainpill { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; color: var(--dim); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
.dot.on { background: var(--good); box-shadow: 0 0 8px var(--good); }
main { padding: 22px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); max-width: 1180px; width: 100%; margin: 0 auto; }
.view-title { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.view-title h1 { margin: 0; font-size: clamp(22px, 3vw, 30px); font-weight: 600; letter-spacing: .01em; text-wrap: balance; }
.view-title p { margin: 4px 0 0; color: var(--dim); }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--cyan); }

/* ---------- Building blocks ---------- */
.card { background: linear-gradient(180deg, rgba(14,26,51,.92), rgba(10,19,38,.92)); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 11px; padding: 9px 14px; font-size: 14px; color: var(--ink); }
.btn:hover { border-color: var(--blue); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 500; }
.btn.primary:hover { background: #4a9dff; }
.btn.ghost { background: transparent; }
.btn.small { padding: 5px 10px; font-size: 13px; border-radius: 9px; }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.stat { display: grid; gap: 2px; }
.stat b { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { color: var(--dim); font-size: 13px; }
.bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--cyan)); border-radius: 999px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
.pill.good { color: var(--good); border-color: rgba(70,224,160,.4); }
.pill.warn { color: var(--warn); border-color: rgba(255,198,92,.4); }
.pill.blue { color: var(--cyan); border-color: rgba(95,212,255,.4); }
.field { display: grid; gap: 6px; font-size: 13px; color: var(--dim); }
.field input, .field select, .field textarea, textarea.box, input.box { background: var(--void); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; color: var(--ink); width: 100%; }
textarea.box { min-height: 130px; resize: vertical; line-height: 1.55; }
.empty { color: var(--dim); padding: 18px; text-align: center; border: 1px dashed var(--line); border-radius: 14px; }
.note { font-size: 13px; color: var(--dim); }
.err { color: var(--bad); }
.toast { position: fixed; bottom: max(18px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--blue); border-radius: 12px; padding: 10px 16px; z-index: 50; box-shadow: 0 10px 40px rgba(0,0,0,.5); max-width: calc(100% - 32px); }

/* ---------- Dashboard ---------- */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 120px; }
.week div { display: flex; flex-direction: column; gap: 6px; align-items: center; justify-content: flex-end; height: 100%; min-height: 0; }
.week div b { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; min-height: 0; }
.week i { width: 100%; max-width: 34px; border-radius: 8px 8px 3px 3px; background: linear-gradient(180deg, var(--cyan), var(--blue)); min-height: 3px; }
.week span { font-size: 11px; color: var(--dim); font-family: var(--mono); }
.skills { display: grid; gap: 10px; }
.skills label { display: grid; grid-template-columns: 110px 1fr 44px; gap: 10px; align-items: center; font-size: 13px; color: var(--dim); }
.skills label em { font-style: normal; text-align: right; font-family: var(--mono); color: var(--ink); }
.langcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.langcard { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.langcard[aria-pressed="true"] { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(47,140,255,.18); }
.langcard .nm { font-size: 17px; font-weight: 600; }

/* ---------- Course ---------- */
.level { border: 1px solid var(--line); border-radius: 16px; background: rgba(10,19,38,.7); margin-bottom: 12px; overflow: hidden; }
.level > summary { list-style: none; cursor: pointer; padding: 16px 18px; display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; }
.level > summary::-webkit-details-marker { display: none; }
.lvbadge { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: rgba(47,140,255,.14); color: var(--cyan); font-weight: 700; font-family: var(--mono); }
.level h3 { margin: 0; font-size: 16px; font-weight: 600; }
.units { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; padding: 0 18px 18px; }
.unit { text-align: left; display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.unit:hover:not(:disabled) { border-color: var(--blue); }
.unit:disabled { opacity: .5; cursor: not-allowed; }
.unit .ic { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; background: var(--line); color: var(--dim); }
.unit.done .ic { background: rgba(70,224,160,.16); color: var(--good); }
.unit.next .ic { background: var(--blue); color: #fff; }
.unit small { color: var(--dim); font-size: 11px; font-family: var(--mono); }

/* ---------- Lesson ---------- */
.lesson { display: grid; gap: 14px; }
.lesson h2 { margin: 0 0 6px; font-size: 18px; font-weight: 600; color: var(--hot); }
.lesson p { margin: 0 0 8px; }
.lesson ul, .lesson ol { margin: 4px 0 8px; padding-left: 20px; }
.ex-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.ex-table td, .ex-table th { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.ex-table th { color: var(--dim); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.tw { overflow-x: auto; }
.say { border: 0; background: rgba(47,140,255,.14); color: var(--cyan); width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; }
.say:hover { background: rgba(47,140,255,.3); }
.say svg { width: 15px; height: 15px; }
.glyphs { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.glyph { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; text-align: center; display: grid; gap: 2px; }
.glyph:hover { border-color: var(--blue); }
.glyph b { font-size: 28px; font-weight: 500; line-height: 1.2; }
.glyph span { font-size: 12px; color: var(--dim); }
.glyph small { font-size: 11px; color: var(--dim); font-family: var(--arabic); direction: rtl; }
.mistake { border-left: 3px solid var(--warn); padding: 6px 12px; margin: 6px 0; background: rgba(255,198,92,.06); border-radius: 0 10px 10px 0; }

/* ---------- Exercises ---------- */
.exq { display: grid; gap: 12px; }
.exhead { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.prompt { font-size: 18px; font-weight: 500; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; }
.opt:hover:not(:disabled) { border-color: var(--blue); }
.opt.sel { border-color: var(--cyan); background: rgba(95,212,255,.08); }
.opt.right { border-color: var(--good); background: rgba(70,224,160,.1); }
.opt.wrong { border-color: var(--bad); background: rgba(255,125,154,.08); }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; min-height: 46px; padding: 8px; border: 1px dashed var(--line); border-radius: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; }
.tile:hover { border-color: var(--blue); }
.feedback { border-radius: 12px; padding: 12px 14px; }
.feedback.ok { background: rgba(70,224,160,.1); border: 1px solid rgba(70,224,160,.35); }
.feedback.no { background: rgba(255,125,154,.08); border: 1px solid rgba(255,125,154,.35); }
.diffw { display: inline-block; padding: 1px 6px; border-radius: 6px; margin: 2px; }
.diffw.hit { background: rgba(70,224,160,.16); color: var(--good); }
.diffw.miss { background: rgba(255,125,154,.14); color: var(--bad); }
.progress-steps { display: flex; gap: 4px; }
.progress-steps i { flex: 1; height: 5px; border-radius: 4px; background: var(--line); }
.progress-steps i.ok { background: var(--good); } .progress-steps i.no { background: var(--bad); } .progress-steps i.cur { background: var(--blue); }

/* ---------- Teacher & Talk ---------- */
.chatwrap { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: 1fr auto; height: min(70vh, 720px); min-height: 420px; }
.chatlog { overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 4px 4px 14px; }
.msg { max-width: 86%; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.msg.you { align-self: flex-end; background: var(--panel); border: 1px solid var(--line); padding: 9px 14px; border-radius: 16px 16px 4px 16px; }
.msg.ai { align-self: flex-start; }
.msg.ai::before { content: attr(data-who); display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .15em; color: var(--cyan); margin-bottom: 2px; }
.msg.sys { align-self: center; color: var(--dim); font-size: 13px; }
.msg .fix { display: block; margin-top: 6px; font-size: 13px; color: var(--warn); }
.composer { display: flex; gap: 6px; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 6px; }
.composer:focus-within { border-color: var(--blue); }
.composer textarea { flex: 1; min-width: 0; resize: none; border: 0; outline: 0; background: transparent; padding: 8px 10px; max-height: 140px; }
.ibtn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 0; background: transparent; color: var(--dim); display: grid; place-items: center; }
.ibtn:hover { color: var(--ink); }
.ibtn[aria-pressed="true"] { color: var(--cyan); background: rgba(95,212,255,.14); }
.ibtn.go { background: var(--blue); color: #fff; }
.ibtn svg { width: 18px; height: 18px; }
.quick { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.quick button { flex: none; font-size: 12.5px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--dim); }
.quick button:hover { color: var(--ink); border-color: var(--blue); }
.talk { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 14px; }
.stage { display: grid; justify-items: center; gap: 12px; padding: 18px; }
.orbwrap { width: min(380px, 78vw); aspect-ratio: 1; max-width: 100%; }
#orb { width: 100%; height: 100%; display: block; }
.state { font-family: var(--mono); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); min-height: 1.4em; }
.state.hot { color: var(--cyan); }
.bigbtn { min-width: 220px; padding: 13px 22px; border-radius: 999px; border: 0; background: var(--blue); color: #fff; font-weight: 600; font-size: 15px; box-shadow: 0 0 40px rgba(47,140,255,.35); }
.bigbtn.end { background: #2a1630; color: var(--bad); box-shadow: none; border: 1px solid rgba(255,125,154,.4); }
.live { min-height: 2.6em; text-align: center; color: var(--hot); font-size: 15px; max-width: 520px; }
.scenarios { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.scn { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
.scn[aria-pressed="true"] { border-color: var(--blue); background: rgba(47,140,255,.12); }
.scn span { display: block; font-size: 11.5px; color: var(--dim); }
.subtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.subtabs button { border: 1px solid var(--line); background: transparent; color: var(--dim); border-radius: 999px; padding: 6px 14px; font-size: 13.5px; }
.subtabs button[aria-pressed="true"] { color: var(--hot); border-color: var(--blue); background: rgba(47,140,255,.14); }

/* ---------- Vocabulary ---------- */
.flash { display: grid; justify-items: center; gap: 14px; text-align: center; padding: 26px 18px; }
.flash .w { font-size: clamp(30px, 6vw, 46px); font-weight: 500; }
.flash .r { color: var(--dim); font-family: var(--mono); }
.vlist { display: grid; gap: 6px; }
.vrow { display: grid; grid-template-columns: auto 1.2fr 1fr auto auto; gap: 10px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 14px; }
.vrow .w { font-weight: 500; }

/* ---------- Voices ---------- */
.voices { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; max-height: 340px; overflow-y: auto; padding-right: 4px; }
.voice { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; text-align: left; font-size: 13.5px; }
.voice[aria-pressed="true"] { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(47,140,255,.16); }
.voice small { display: block; color: var(--dim); font-size: 11.5px; }

/* ---------- Modal ---------- */
.modal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(3,5,11,.8); backdrop-filter: blur(8px); padding: 16px; }
.modal .card { width: min(620px, 100%); max-height: 90vh; overflow: auto; display: grid; gap: 14px; }

@media (max-width: 900px) {
  .g3, .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .talk { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .g2, .g3, .g4 { grid-template-columns: 1fr; }
  .skills label { grid-template-columns: 90px 1fr 40px; }
  .vrow { grid-template-columns: auto 1fr auto; }
  .vrow .tr, .vrow .lst { display: none; }
  nav.tabs { order: 3; flex: 1 1 100%; overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; }
  .langpick { flex: 1; justify-content: flex-end; min-width: 0; }
  .logo span { display: none; }
  .langpick .sel { min-width: 0; max-width: 150px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="logo"><b>NxxR</b> <span>Language Academy</span></div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <button data-view="dashboard">Dashboard</button>
      <button data-view="course">Course</button>
      <button data-view="teacher">Teacher</button>
      <button data-view="talk">Talk</button>
      <button data-view="practice">Practice</button>
      <button data-view="vocab">Vocabulary</button>
      <button data-view="grammar">Grammar</button>
      <button data-view="settings">Settings</button>
    </nav>
    <div class="langpick">
      <select class="sel" id="activeLang" aria-label="Language you are learning"></select>
      <button class="brainpill" id="brainPill" type="button" title="AI brain"><span class="dot" id="brainDot"></span><span id="brainName">No brain</span></button>
    </div>
  </header>
  <main id="main">
    <section id="v-dashboard" data-v></section>
    <section id="v-course" data-v hidden></section>
    <section id="v-lesson" data-v hidden></section>
    <section id="v-teacher" data-v hidden></section>
    <section id="v-talk" data-v hidden></section>
    <section id="v-practice" data-v hidden></section>
    <section id="v-vocab" data-v hidden></section>
    <section id="v-grammar" data-v hidden></section>
    <section id="v-settings" data-v hidden></section>
  </main>
</div>
<div class="modal" id="modal" hidden><div class="card" id="modalCard" role="dialog" aria-modal="true"></div></div>

<script>
"use strict";
/* ============================================================
   0. UTILITIES
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("nxxr." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("nxxr." + k, JSON.stringify(v)); } catch { toast("Your browser storage is full or blocked; progress may not be saved."); } },
  del(k) { try { localStorage.removeItem("nxxr." + k); } catch {} },
};
const today = () => new Date().toISOString().slice(0, 10);
const dayKey = d => d.toISOString().slice(0, 10);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
let toastT = null;
function toast(msg) {
  let t = $("#toast"); if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); document.body.append(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3800);
}

/* chat(): stream text from the active brain. turns = [{role, content}], last is user. */
async function chat({ system, turns, onText = () => {}, signal, json = false, long = false, images = [] }) {
  if (!brain && !(await detectBrain())) throw new Error("No AI brain connected yet.");
  if (brain.kind === "ollama") {
    const msgs = [{ role: "system", content: system }, ...turns.map((t, i) => (i === turns.length - 1 && images.length) ? { ...t, images: images.map(x => x.b64) } : t)];
    const r = await fetch(B().ollamaUrl.replace(/\/$/, "") + "/api/chat", {
      method: "POST", signal, headers: { "content-type": "application/json" },
      body: JSON.stringify({ model: B().ollamaModel, messages: msgs, stream: true, think: false, keep_alive: "30m", ...(json ? { format: "json" } : {}), options: { num_predict: long ? 3500 : (profile.smart ? 900 : 450) } }),
    });

    return readNDJSON(r, onText);
  }
  if (brain.kind === "claude") {
    const messages = turns.map((t, i) => (i === turns.length - 1 && images.length)
      ? { role: "user", content: [...images.map(x => ({ type: "image", source: { type: "base64", media_type: x.type, data: x.b64 } })), { type: "text", text: t.content }] }
      : t);
    const r = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST", signal,
      headers: { "content-type": "application/json", "x-api-key": B().apiKey.trim(), "anthropic-version": "2026-10-21", "anthropic-beta": "server-side-fallback-2026-07-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: B().claudeModel || "claude-opus-5-5", max_tokens: 16000, system, messages, stream: true, output_config: { effort: long ? "medium" : (profile.smart ? "high" : "low") }, fallbacks: "default" }),

    let text = "";

}

function bubble(log, role, text, who = "TEACHER") { const d = document.createElement("div"); d.className = "msg " + role; d.dataset.who = who; d.textContent = text; log.append(d); log.scrollTop = log.scrollHeight; return d; }

}

function talkSystem() {
  const t = LANGS[profile.active], s = SCENARIOS.find(x => x[0] === talk.scenario);
  const role = talk.scenario === "free" ? `Have a natural, flowing conversation in ${t.name}: be curious, react, ask follow-up questions, share opinions, joke when it fits.` : `ROLE-PLAY: "${s[1]}" (${s[2]}). Play the other person (e.g. waiter, agent, receptionist, doctor, interviewer) realistically in ${t.name}. Start the scene yourself. Stay in character.`;

  return persona(`VOICE CONVERSATION. Your replies are spoken aloud: 1-3 short sentences, plain spoken ${t.name}, no lists, no markdown, no emojis, no stage directions. ${role} ${diff}

}
function talkLine(role, text, fix, log = $("#talkLog")) {
  if (!log) return;
  const d = document.createElement("div"); d.className = "msg " + (role === "user" ? "you" : "ai"); d.dataset.who = "NXXR"; d.textContent = text;
  if (fix) { const f = document.createElement("span"); f.className = "fix"; f.textContent = "✎ " + fix; d.append(f); }
  log.append(d); log.scrollTop = log.scrollHeight;
}
async function startTalk() {
  if (!(await needBrain())) return;
  unlockVoice(); talk.active = true; talk.muted = false; talk.turns = []; $("#talkLog") && ($("#talkLog").innerHTML = "");
  $("#talkBtn").textContent = "End conversation"; $("#talkBtn").classList.add("end"); $("#muteBtn").disabled = false;
  startRec();
  // the AI opens the conversation
  talkTurn(null);
}
function endTalk() {
  talk.active = false; stopRec(); stopVoice(); talk.ctl?.abort(); clearTimeout(talk.silenceT);
  const b = $("#talkBtn"); if (b) { b.textContent = "Start conversation"; b.classList.remove("end"); }
  const m = $("#muteBtn"); if (m) m.disabled = true;
  orbState("idle");
  if (talk.turns.filter(t => t.role === "user").length) { addXP(Math.min(30, talk.turns.length * 2)); addSkill("speaking", true); }
}
function startRec() {
  if (!Rec || !talk.active || talk.muted) return;
  try { talk.rec?.abort(); } catch {}
  const r = new Rec(); talk.rec = r;
  r.lang = LANGS[profile.active].stt; r.continuous = true; r.interimResults = true;
  r.onresult = e => {
    let interim = "", fin = "";
    for (let i = e.resultIndex; i < e.results.length; i++) { const tx = e.results[i][0].transcript; if (e.results[i].isFinal) fin += tx + " "; else interim += tx; }
    const heard = (talk.buffer + fin + interim).trim();
    // barge-in: the student speaks over the AI (ignore the AI's own voice leaking into the mic)
    if (speakingNow && interim.trim().length > 6 && similarity(interim, speakingNow.slice(0, interim.length + 10)) < .5) { stopVoice(); talk.ctl?.abort(); orbState("listening"); }
    if (fin) talk.buffer += fin;
    if (heard && !(speakingNow && similarity(heard, speakingNow) > .5)) { $("#liveCap").textContent = heard; orbState("listening"); }
    clearTimeout(talk.silenceT);
    talk.silenceT = setTimeout(() => { const t = talk.buffer.trim(); if (t && !talk.busy) { talk.buffer = ""; talkTurn(t); } }, 1100);
  };
  r.onerror = e => { if (e.error === "not-allowed") { toast("Microphone blocked. Allow it in the address bar."); endTalk(); } };
  r.onend = () => { if (talk.active && !talk.muted && talk.rec === r) setTimeout(startRec, 200); };
  try { r.start(); } catch {}
}
function stopRec() { const r = talk.rec; talk.rec = null; try { r?.abort(); } catch {} }
async function talkTurn(userText) {
  if (!talk.active) return;
  if (userText) { talk.turns.push({ role: "user", content: userText }); talkLine("user", userText); $("#liveCap").textContent = ""; }
  talk.busy = true; orbState("thinking"); stopVoice();
  const turns = talk.turns.length ? talk.turns.slice(-14).map(t => ({ role: t.role, content: t.content })) : [{ role: "user", content: "(The student just started the session. Open the conversation now, in character.)" }];
  if (turns[0].role !== "user") turns.unshift({ role: "user", content: "(Session start.)" });
  talk.ctl = new AbortController();
  let spoken = 0, full = "";
  const speakNew = (final) => {
    const vis = full.replace(/\[\[[\s\S]*?(\]\]|$)/g, "").replace(/<think>[\s\S]*?(<\/think>|$)/g, ""), rest = vis.slice(spoken);
    const m = final ? (rest.trim() ? [rest] : null) : rest.match(/^[\s\S]*?[.!?…。？！](?=\s|$)/);
    if (m && (final || m[0].trim().length > 4)) { say(m[0], profile.active); spoken += m[0].length; if (!final) speakNew(false); }
  };
  try {
    full = await chat({ system: talkSystem(), turns, signal: talk.ctl.signal, onText: t => { full = t; speakNew(false); } });
    speakNew(true);
    const fix = (full.match(/\[\[fix:\s*([\s\S]*?)\]\]/i) || [])[1];
    const clean = full.replace(/\[\[[\s\S]*?\]\]/g, "").replace(/<think>[\s\S]*?<\/think>/g, "").trim();
    talk.turns.push({ role: "assistant", content: clean, fix }); talkLine("assistant", clean, fix);
  } catch (e) { if (e.name !== "AbortError") { talkLine("assistant", "(" + e.message + ")"); } }
  finally { talk.busy = false; if (!speakingNow) orbRest(); }
}

      const qs = sanitizeExercises(j.questions);
      $("#rOut").innerHTML = `<div class="grid g2"><div class="card"><h2 style="margin:0 0 8px;font-size:18px" class="${tc}">${esc(j.title || type)}</h2>
        ${listening ? `<div class="row"><button class="btn primary" id="rPlay">${SPK} Play</button><button class="btn ghost" id="rSlow">Slower</button><button class="btn ghost" id="rShow">Show transcript</button></div><p id="rText" class="${tc}" hidden style="white-space:pre-wrap;margin-top:12px">${esc(j.text)}</p>` : `<div class="row"><button class="btn small" id="rPlay">${SPK} Read it to me</button></div><p class="${tc}" style="white-space:pre-wrap;margin-top:10px;font-size:16.5px;line-height:1.75">${esc(j.text)}</p>`}
        ${(j.glossary || []).length ? `<details style="margin-top:10px"><summary class="note">Glossary</summary><table class="ex-table">${j.glossary.map(g => `<tr><td class="${tc}">${esc(g.word)}</td><td>${esc(g.meaning)}</td></tr>`).join("")}</table></details>` : ""}</div><div id="rQs"></div></div>`;
      $("#rPlay").onclick = () => { stopVoice(); say(j.text, code); };
      const sl = $("#rSlow"); if (sl) sl.onclick = () => { stopVoice(); say(j.text, code, { rate: .75 }); };
      const sh = $("#rShow"); if (sh) sh.onclick = () => { $("#rText").hidden = !$("#rText").hidden; };
      if (listening) setTimeout(() => say(j.text, code), 400);
      runExercises($("#rQs"), qs, { code, unitTitle: listening ? "Listening" : "Reading", kind: listening ? "listening" : "reading" }, res => {
        addSkill(listening ? "listening" : "reading", res.score >= 70, code);
        $("#rQs").innerHTML = `<div class="card" style="text-align:center"><div style="font-size:40px;font-weight:600">${res.score}%</div><p>${res.score >= 80 ? "Excellent comprehension." : "Read it once more and look at the glossary; then try a new one."}</p>${listening ? `<button class="btn" onclick="document.getElementById('rText').hidden=false">Show transcript</button>` : ""}</div>`;
      });
    } catch (e) { $("#rOut").innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
  };
}

/* ============================================================
   18. SETTINGS (voices with previews, personality, languages, brain, data)
   ============================================================ */
let voiceFilter = "all";
function renderSettings() {
  const code = profile.active, list = voicesFor(code), cur = voiceFor(code);
  const filtered = list.filter(v => voiceFilter === "all" || (voiceFilter === "local" ? v.localService : voiceFilter === "online" ? !v.localService : v.lang.replace("_", "-") === voiceFilter));
  const accents = [...new Set(list.map(v => v.lang.replace("_", "-")))];
  const langOpts = (sel) => Object.entries(LANGS).map(([c, l]) => `<option value="${c}" ${c === sel ? "selected" : ""}>${esc(l.name)}</option>`).join("");
  $("#v-settings").innerHTML = `<div class="view-title"><div><div class="eyebrow">Settings</div><h1>Make it yours</h1><p>Saved in this browser only. Nothing leaves your computer except messages to the AI brain you choose.</p></div></div>
  <div class="grid g2">
    <div class="card grid" style="gap:12px"><h3 style="margin:0;font-size:15px">Languages</h3>
      <label class="field">Your native language <select id="sNative">${langOpts(profile.native)}</select></label>
      <label class="field">Explanations <select id="sExplain"><option value="native">In my native language when needed</option><option value="immersion">Immersion: in the language I'm learning</option></select></label>
      <div class="field">Languages you're learning (progress is kept separately)<div class="row">${profile.learning.map(c => `<span class="pill ${c === code ? "blue" : ""}">${esc(LANGS[c].name)} ${profile.learning.length > 1 ? `<button class="btn small ghost" data-rm="${c}" style="padding:0 4px;border:0" aria-label="Stop learning ${esc(LANGS[c].name)}">×</button>` : ""}</span>`).join("")}</div>
        <div class="row"><select class="sel" id="addLangSel">${Object.entries(LANGS).filter(([c]) => !profile.learning.includes(c)).map(([c, l]) => `<option value="${c}">${esc(l.name)}</option>`).join("")}</select><button class="btn small" id="addLang">Add language</button></div></div>
      ${code === "en" ? `<label class="field">English variant <select id="sVariant"><option>British</option><option>American</option></select></label>` : ""}
    </div>
    <div class="card grid" style="gap:12px"><h3 style="margin:0;font-size:15px">Teacher personality</h3>
      <div class="subtabs" id="sPers" style="margin:0">${[["sarcastic","Sarcastic"],["casual","Casual"],["professional","Professional"],["patient","Patient teacher"]].map(([k, n]) => `<button data-pers="${k}" aria-pressed="${profile.personality === k}">${n}</button>`).join("")}</div>
      <div class="row2 grid g2"><label class="field">Sarcasm <input type="range" id="sSarc" min="0" max="3" step="1" value="${profile.sarcasm}"></label><label class="field">Humor <input type="range" id="sHum" min="0" max="3" step="1" value="${profile.humor}"></label></div>
      <div class="grid g3"><label class="field">Explanations <select id="sLevel"><option value="simple">Simple</option><option value="normal">Normal</option><option value="detailed">Detailed</option></select></label>
      <label class="field">Difficulty <select id="sDiff"><option value="easy">Gentle</option><option value="normal">Normal</option><option value="hard">Demanding</option></select></label>
      <label class="field">Daily goal <select id="sGoal"><option value="20">20 XP</option><option value="50">50 XP</option><option value="100">100 XP</option><option value="200">200 XP</option></select></label></div>
    </div>
  </div>
  <div class="card" style="margin-top:14px"><div class="between"><h3 style="margin:0;font-size:15px">Voice for ${esc(LANGS[code].name)}</h3>
      <div class="row"><select class="sel" id="vFilter"><option value="all">All voices</option><option value="local">On this device</option><option value="online">Online (often higher quality)</option>${accents.map(a => `<option value="${a}">${a}</option>`).join("")}</select></div></div>
    <p class="note">Tap ▶ to preview, then choose. Voices come from your computer and browser; newer Macs have "Enhanced" and "Premium" voices you can download in System Settings → Accessibility → Spoken Content → System voice → Manage Voices.${!list.length ? ` <b>No ${esc(LANGS[code].name)} voice is installed on this device yet${LANGS[code].ttsFallback ? "; a fallback voice will be used" : ""}.</b>` : ""}</p>
    <div class="voices" style="margin-top:10px">${filtered.map(v => `<button class="voice" data-voice="${esc(v.name)}" aria-pressed="${cur && v.name === cur.name}"><span>${esc(v.name)}<small>${esc(v.lang)} · ${v.localService ? "on device" : "online"}</small></span><span class="say" data-preview="${esc(v.name)}" role="button" aria-label="Preview ${esc(v.name)}">▶</span></button>`).join("") || `<div class="empty">No voices match.</div>`}</div>
    <div class="grid g3" style="margin-top:12px"><label class="field">Speed <input type="range" id="sRate" min=".6" max="1.5" step=".05" value="${profile.rate}"></label><label class="field">Volume <input type="range" id="sVol" min="0" max="1" step=".05" value="${profile.volume}"></label><div class="field">&nbsp;<button class="btn" id="sTest">Test this voice</button></div></div></div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card grid" style="gap:10px"><div class="between"><h3 style="margin:0;font-size:15px">AI brain</h3><span class="pill ${brain ? "good" : "warn"}">${brain ? esc(brain.label) : "not connected"}</span></div>
      <label class="field">Use <select id="sBrain"><option value="auto">Automatic</option><option value="ollama">Ollama (free, on this computer)</option><option value="claude">Claude API (best quality)</option><option value="chrome">Chrome built-in AI</option></select></label>
      <div class="grid g2"><label class="field">Ollama model <select id="sOModel">${(ollamaModels.length ? ollamaModels : [B().ollamaModel || "(none)"]).map(m => `<option ${m === B().ollamaModel ? "selected" : ""}>${esc(m)}</option>`).join("")}</select></label><label class="field">Claude model <input id="sCModel" value="${esc(B().claudeModel)}"></label></div>
      <label class="field">Claude API key <input id="sKey" type="password" value="${esc(B().apiKey)}" placeholder="sk-ant-…" autocomplete="off"></label>
      <div class="row"><button class="btn small" id="sCheck">Check connection</button><button class="btn small ghost" id="sHelp">Setup help</button><label class="row note" style="gap:6px"><input type="checkbox" id="sSmart" ${profile.smart ? "checked" : ""}> Smarter, slower answers</label></div></div>
    <div class="card grid" style="gap:10px"><h3 style="margin:0;font-size:15px">Your data</h3><p class="note" style="margin:0">Export a backup, move it to another computer, or delete it.</p>
      <div class="row"><button class="btn small" id="dExport">Export backup</button><label class="btn small" style="display:inline-block">Import backup<input type="file" id="dImport" accept="application/json" hidden></label></div>
      <div class="row"><button class="btn small" id="dResetLang">Reset ${esc(LANGS[code].name)} progress</button><button class="btn small" id="dWipe" style="color:var(--bad)">Delete everything</button></div><p class="note" id="dMsg"></p></div>
  </div>`;
  const S = id => $("#" + id);
  S("sExplain").value = profile.explainLang; S("sLevel").value = profile.explainLevel; S("sDiff").value = profile.difficulty; S("sGoal").value = String(profile.dailyGoal); S("sBrain").value = B().mode; S("vFilter").value = voiceFilter;
  if (S("sVariant")) { S("sVariant").value = profile.englishVariant; S("sVariant").onchange = e => { profile.englishVariant = e.target.value; saveProfile(); }; }
  S("sNative").onchange = e => { profile.native = e.target.value; saveProfile(); toast("Native language saved. New lessons will explain in " + LANGS[profile.native].name + "."); };
  S("sExplain").onchange = e => { profile.explainLang = e.target.value; saveProfile(); };
  S("sLevel").onchange = e => { profile.explainLevel = e.target.value; saveProfile(); };
  S("sDiff").onchange = e => { profile.difficulty = e.target.value; saveProfile(); };
  S("sGoal").onchange = e => { profile.dailyGoal = +e.target.value; saveProfile(); };
  S("sSarc").oninput = e => { profile.sarcasm = +e.target.value; saveProfile(); };
  S("sHum").oninput = e => { profile.humor = +e.target.value; saveProfile(); };
  $$("[data-pers]").forEach(b => b.onclick = () => { profile.personality = b.dataset.pers; saveProfile(); $$("[data-pers]").forEach(x => x.setAttribute("aria-pressed", x === b)); });
  S("addLang").onclick = () => { const c = S("addLangSel").value; if (!c) return; profile.learning.push(c); profile.active = c; saveProfile(); renderLangSelect(); renderSettings(); toast(LANGS[c].name + " added. Its progress is separate."); };
  $$("[data-rm]").forEach(b => b.onclick = () => { profile.learning = profile.learning.filter(c => c !== b.dataset.rm); if (!profile.learning.includes(profile.active)) profile.active = profile.learning[0]; saveProfile(); renderLangSelect(); renderSettings(); });
  S("vFilter").onchange = e => { voiceFilter = e.target.value; renderSettings(); };
  $$("[data-voice]").forEach(b => b.onclick = e => {
    const name = b.dataset.voice;
    if (e.target.closest("[data-preview]")) { const v = VOICES.find(x => x.name === name); stopVoice(); const u = new SpeechSynthesisUtterance(sampleLine(code)); if (v) { u.voice = v; u.lang = v.lang; } u.rate = profile.rate; u.volume = profile.volume; synth.speak(u); return; }
    profile.voices[code] = name; saveProfile(); $$("[data-voice]").forEach(x => x.setAttribute("aria-pressed", x === b)); stopVoice(); say(sampleLine(code), code);
  });
  S("sRate").oninput = e => { profile.rate = +e.target.value; saveProfile(); };
  S("sVol").oninput = e => { profile.volume = +e.target.value; saveProfile(); };
  S("sTest").onclick = () => { stopVoice(); say(sampleLine(code), code); };
  S("sBrain").onchange = async e => { B().mode = e.target.value; saveProfile(); await detectBrain(); renderSettings(); };
  S("sOModel").onchange = e => { B().ollamaModel = e.target.value; saveProfile(); detectBrain(); };
  S("sCModel").onchange = e => { B().claudeModel = e.target.value.trim() || "claude-opus-5-5"; saveProfile(); };
  S("sKey").onchange = async e => { B().apiKey = e.target.value.trim(); saveProfile(); await detectBrain(); renderSettings(); };
  S("sCheck").onclick = async () => { await detectBrain(); renderSettings(); toast(brain ? "Connected: " + brain.label : "No brain found. Click Setup help."); };
  S("sHelp").onclick = openBrainHelp;
  S("sSmart").onchange = e => { profile.smart = e.target.checked; saveProfile(); };
  S("dExport").onclick = () => {
    const data = {}; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith("nxxr.")) data[k] = localStorage.getItem(k); }
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: "application/json" })); a.download = `nxxr-academy-backup-${today()}.json`; a.click(); S("dMsg").textContent = "Backup downloaded.";
  };
  S("dImport").onchange = async e => { try { const data = JSON.parse(await e.target.files[0].text()); for (const [k, v] of Object.entries(data)) if (k.startsWith("nxxr.")) localStorage.setItem(k, v); location.reload(); } catch { S("dMsg").textContent = "That file isn't an NxxR backup."; } };
  let wipeArmed = false, resetArmed = false;
  S("dResetLang").onclick = () => { if (!resetArmed) { resetArmed = true; S("dResetLang").textContent = "Click again to reset"; return; } store.del("prog." + code); delete prog.cache[code]; S("dMsg").textContent = LANGS[code].name + " progress reset."; renderSettings(); };
  S("dWipe").onclick = () => { if (!wipeArmed) { wipeArmed = true; S("dWipe").textContent = "Click again: this can't be undone"; return; } Object.keys(localStorage).filter(k => k.startsWith("nxxr.")).forEach(k => localStorage.removeItem(k)); location.reload(); };
}
function sampleLine(code) {
  return { en: "Hello! I'm your NxxR teacher. Ready when you are.", fr: "Bonjour ! Je suis ton professeur NxxR. On commence quand tu veux.", ar: "مرحبا! أنا معلمك في إن إكس آر. هل نبدأ؟", es: "¡Hola! Soy tu profesor de NxxR. ¿Empezamos?", ha: "Sannu! Ni ne malaminka na NxxR. Mu fara?", pcm: "How far! Na me be your NxxR teacher. Make we start?", zh: "你好！我是你的NxxR老师。我们开始吧。", ja: "こんにちは！NxxRの先生です。始めましょう。", de: "Hallo! Ich bin dein NxxR-Lehrer. Legen wir los?", pt: "Olá! Sou o teu professor da NxxR. Vamos começar?", it: "Ciao! Sono il tuo insegnante NxxR. Cominciamo?", ru: "Привет! Я твой преподаватель NxxR. Начнём?" }[code] || "Hello!";
}

/* ============================================================
   19. ONBOARDING & START
   ============================================================ */
function onboarding() {
  const opts = sel => Object.entries(LANGS).map(([c, l]) => `<option value="${c}" ${c === sel ? "selected" : ""}>${esc(l.name)} · ${esc(l.native)}</option>`).join("");
  modal(`<div class="eyebrow">Welcome to NxxR Language Academy</div><h2 style="margin:0">Let's set you up</h2>
    <p class="note" style="margin:0">From your very first word to fluency. Two questions and we start.</p>
    <label class="field">My native language <select id="oNative">${opts(profile.native)}</select></label>
    <label class="field">I want to learn <select id="oLearn">${opts(profile.active === profile.native ? "en" : profile.active)}</select></label>
    <label class="field">Teacher personality <select id="oPers"><option value="sarcastic">Sarcastic (witty, teases you a little)</option><option value="casual">Casual</option><option value="professional">Professional</option><option value="patient">Patient teacher</option></select></label>
    <p class="note" style="margin:0">Everyone starts at Level 0. Already know the basics? Take a level test from the Course page to skip ahead.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn primary" id="oGo">Start learning</button></div>`);
  $("#oGo").onclick = () => {
    const n = $("#oNative").value, l = $("#oLearn").value;
    if (n === l) { toast("Pick a language different from your native one."); return; }
    Object.assign(profile, { native: n, active: l, learning: [l], personality: $("#oPers").value, onboarded: true });
    saveProfile(); closeModal(); renderLangSelect(); show("dashboard");
    detectBrain().then(b => { if (!b) openBrainHelp(); });
  };
}
renderLangSelect();
show("dashboard");
if (!profile.onboarded) onboarding(); else detectBrain();
</script>
