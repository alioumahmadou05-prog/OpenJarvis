<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nx Ai · Nour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Two rooms: the assistant (orb, voice controls) and the conversation (text). */
:root {
  --void: #05030a;
  --deck: #0a0712;
  --panel: #110c1d;
  --line: #2a2140;
  --ink: #ece6ff;
  --dim: #8f84ad;
  --plasma: #b67cff;
  --hot: #e9d4ff;
  --bad: #ffb3c8;
  --display: "Sora", "Avenir Next", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--void); color: var(--ink); font: 15px/1.55 var(--display); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-columns: minmax(320px, 1fr) minmax(360px, 1.1fr); }
.app.solo { grid-template-columns: 1fr; }
.app.solo .chat { display: none; }

/* ---------- Assistant room ---------- */
.stage {
  position: relative; display: grid; grid-template-rows: auto 1fr auto auto; align-items: center; justify-items: center;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  background: radial-gradient(ellipse at 50% 42%, #140b26 0%, var(--void) 62%);
  min-height: 0; gap: 10px;
}
.topbar { width: 100%; display: flex; justify-content: space-between; align-items: center; }
.brand { font-family: var(--mono); font-size: 11px; letter-spacing: .2em; color: var(--dim); text-transform: uppercase; }
.orbwrap { width: min(440px, 80vw, 52vh); aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; cursor: pointer; }
#orb { width: 100%; height: 100%; display: block; }
.plate { text-align: center; display: grid; gap: 4px; }
.plate h1 {
  margin: 0; font-weight: 300; font-size: clamp(30px, 4.4vw, 46px); letter-spacing: .32em; padding-left: .32em;
  color: var(--hot); text-shadow: 0 0 18px rgba(182,124,255,.55), 0 0 2px rgba(255,255,255,.6);
}
.status { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); min-height: 1.5em; }
.status.hot { color: var(--plasma); }
.controls { display: grid; gap: 14px; justify-items: center; width: 100%; }
.voicebar { display: flex; align-items: center; gap: 14px; }
.round {
  width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel);
  color: var(--dim); display: grid; place-items: center;
}
.round:hover { color: var(--ink); border-color: var(--plasma); }
.round[aria-pressed="true"] { color: var(--hot); background: rgba(182,124,255,.16); border-color: var(--plasma); }
.round svg { width: 20px; height: 20px; }
.mic {
  width: 74px; height: 74px; border-radius: 50%; border: 0; display: grid; place-items: center;
  background: var(--plasma); color: var(--void); box-shadow: 0 0 0 6px rgba(182,124,255,.12), 0 0 40px rgba(182,124,255,.35);
  transition: transform .15s, box-shadow .2s;
}
.mic svg { width: 30px; height: 30px; }
.mic:hover { transform: scale(1.04); }
.mic.live { background: var(--hot); box-shadow: 0 0 0 10px rgba(233,212,255,.16), 0 0 60px rgba(233,212,255,.5); }
.hands { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); }
.switch { position: relative; width: 38px; height: 22px; border-radius: 999px; background: var(--line); border: 0; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--dim); transition: left .2s, background .2s; }
.switch[aria-checked="true"] { background: rgba(182,124,255,.5); }
.switch[aria-checked="true"]::after { left: 19px; background: var(--hot); }
.modes { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.mode { font-size: 13px; color: var(--dim); background: transparent; border: 1px solid transparent; border-radius: 999px; padding: 5px 12px; }
.mode:hover { color: var(--ink); }
.mode[aria-pressed="true"] { color: var(--hot); border-color: var(--plasma); background: rgba(182,124,255,.12); }
.pill-select { font-size: 13px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; }

/* ---------- Conversation room ---------- */
.chat {
  min-height: 0; display: grid; grid-template-rows: auto 1fr auto; background: var(--deck);
  border-left: 1px solid var(--line);
  padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) 16px;
}
.chathead { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.chathead h2 { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: .04em; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 13px; color: var(--dim); }
.ghost:hover { color: var(--ink); border-color: var(--plasma); }
.log { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 16px 2px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.msg { min-width: 0; max-width: 90%; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.you { align-self: flex-end; background: var(--panel); border: 1px solid var(--line); padding: 8px 14px; border-radius: 16px 16px 4px 16px; }
.msg.ai { align-self: flex-start; }
.msg.ai::before { content: "NOUR"; display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .15em; color: var(--plasma); margin-bottom: 2px; }
.msg.err { color: var(--bad); }
.msg .pics { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.msg .pics img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; }
.msg .note { display: block; font-family: var(--mono); font-size: 11px; color: var(--dim); }
.msg .mem { display: block; margin-top: 6px; font-family: var(--mono); font-size: 11px; color: var(--plasma); }
.setup { align-self: stretch; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 10px; }
.setup h3 { margin: 0; font-size: 16px; font-weight: 500; }
.setup p, .setup li { margin: 0; color: var(--dim); font-size: 13.5px; }
.setup ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.setup code { font-family: var(--mono); font-size: 12px; color: var(--hot); background: var(--void); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; overflow-wrap: anywhere; }
.setup .opt { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 8px; }
.setup .row { display: flex; gap: 8px; flex-wrap: wrap; }
.dock { display: grid; gap: 8px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; font-size: 13px; color: var(--dim); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; }
.chip:hover { color: var(--ink); border-color: var(--plasma); }
.tray { display: flex; gap: 8px; flex-wrap: wrap; }
.att { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; font-size: 12px; color: var(--dim); }
.att img { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; }
.x { width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--line); color: var(--ink); line-height: 1; padding: 0; }
form.bar { display: flex; align-items: flex-end; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 6px; }
form.bar:focus-within { border-color: var(--plasma); box-shadow: 0 0 0 4px rgba(182,124,255,.12); }
#q { flex: 1; min-width: 0; resize: none; border: 0; outline: 0; background: transparent; padding: 8px 10px; max-height: 140px; line-height: 1.5; }
#q::placeholder { color: var(--dim); }
.ibtn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 0; background: transparent; color: var(--dim); display: grid; place-items: center; }
.ibtn:hover { color: var(--ink); }
.ibtn svg { width: 18px; height: 18px; }
.send { background: var(--plasma); color: var(--void); }
.send:hover { background: var(--hot); color: var(--void); }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-family: var(--mono); font-size: 11px; color: var(--dim); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.seg button { border: 0; background: transparent; color: var(--dim); border-radius: 999px; padding: 4px 10px; font-family: var(--mono); font-size: 11px; }
.seg button[aria-pressed="true"] { background: rgba(182,124,255,.18); color: var(--hot); }

/* ---------- Settings ---------- */
.sheet { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(5,3,10,.75); backdrop-filter: blur(6px); padding: 16px; }
.card { width: min(520px, 100%); max-height: 88vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 14px; }
.card h2 { margin: 0; font-size: 18px; font-weight: 500; }
.card h3 { margin: 6px 0 0; font-size: 14px; font-weight: 500; color: var(--hot); letter-spacing: .04em; }
.card p { margin: 0; color: var(--dim); font-size: 13px; }
.field { display: grid; gap: 6px; font-size: 13px; color: var(--dim); }
.field input, .field select { background: var(--void); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; color: var(--ink); width: 100%; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.facts li { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 6px 0; font-size: 14px; }
.btn { border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 8px 12px; font-size: 13px; }
.btn.primary { background: var(--plasma); border-color: var(--plasma); color: var(--void); }
.btn.danger { color: var(--bad); }
.between { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.okdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); margin-right: 6px; }
.okdot.on { background: #7dffb0; box-shadow: 0 0 8px #7dffb0; }

@media (max-width: 820px) {
  body { overflow: auto; }
  .app { grid-template-columns: 1fr; grid-template-rows: auto minmax(70vh, 1fr); height: auto; min-height: 100%; }
  .app.solo { grid-template-rows: 1fr; height: 100%; }
  .orbwrap { width: min(300px, 70vw); }
  .chat { border-left: 0; border-top: 1px solid var(--line); }
  .row2 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .mic { transition: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <!-- Assistant room -->
  <section class="stage" aria-label="Voice assistant">
    <div class="topbar">
      <span class="brand"><span class="okdot" id="brainDot"></span><span id="brainName">No brain yet</span></span>
      <div style="display:flex;gap:8px">
        <button class="ghost" type="button" id="toggleChat" aria-pressed="true">Hide text</button>
        <button class="ghost" type="button" id="openSettings">Settings</button>
      </div>
    </div>
    <div class="orbwrap" id="orbwrap" title="Tap to talk"><canvas id="orb" aria-hidden="true"></canvas></div>
    <div class="plate">
      <h1>Nx Ai</h1>
      <div class="status" id="status" role="status">Starting…</div>
    </div>
    <div class="controls">
      <div class="voicebar">
        <button class="round" type="button" id="speaker" aria-pressed="true" title="Nour speaks replies aloud">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        </button>
        <button class="mic" type="button" id="mic" aria-label="Talk to Nour" title="Talk to Nour">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button class="round" type="button" id="stopAll" title="Stop talking">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
        </button>
      </div>
      <div class="hands"><button class="switch" type="button" role="switch" aria-checked="false" id="handsFree" aria-label="Always listen for Nour"></button><label for="handsFree">Always listen for “Nour”</label></div>
      <div class="modes" id="modes" role="group" aria-label="Mode">
        <button class="mode" type="button" data-mode="chat">Chat</button>
        <button class="mode" type="button" data-mode="drague">Drague</button>
        <button class="mode" type="button" data-mode="langue">Langue</button>
        <button class="mode" type="button" data-mode="etude">Étude</button>
        <button class="mode" type="button" data-mode="traduction">Traduction</button>
        <select class="pill-select" id="lang" aria-label="Language" hidden></select>
      </div>
    </div>
  </section>

  <!-- Conversation room -->
  <section class="chat" aria-label="Conversation">
    <div class="chathead">
      <h2>Conversation</h2>
      <button class="ghost" type="button" id="clearChat">Clear</button>
    </div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="dock">
      <div class="chips" id="chips"></div>
      <div class="tray" id="tray" hidden></div>
      <form class="bar" id="bar">
        <button class="ibtn" type="button" id="attach" title="Add a photo or text file" aria-label="Add a photo or text file">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg>
        </button>
        <input type="file" id="file" multiple hidden accept="image/*,.txt,.md,.csv,.json,.srt,text/plain">
        <textarea id="q" rows="1" placeholder="Type to Nour…" aria-label="Message Nour"></textarea>
        <button class="ibtn send" type="submit" id="send" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </form>
      <div class="foot">
        <div class="seg" role="group" aria-label="Speed">
          <button type="button" id="fast" aria-pressed="true">Fast</button>
          <button type="button" id="smart" aria-pressed="false">Smart</button>
        </div>
        <span id="memCount">Memory · 0</span>
      </div>
    </div>
  </section>
</div>

<!-- Settings -->
<div class="sheet" id="sheet" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="between"><h2 id="setTitle">Settings</h2><button class="btn" type="button" id="closeSettings">Close</button></div>

    <h3>Brain</h3>
    <label class="field">Which brain Nour uses
      <select id="brainSel">
        <option value="auto">Automatic (best available)</option>
        <option value="ollama">Ollama on this computer (free, private)</option>
        <option value="claude">Claude API (your API key)</option>
        <option value="chrome">Chrome built-in AI (if your Chrome has it)</option>
      </select>
    </label>
    <div class="row2">
      <label class="field">Ollama address <input id="ollamaUrl" placeholder="http://localhost:11434"></label>
      <label class="field">Ollama model <select id="ollamaModel"></select></label>
    </div>
    <label class="field">Claude API key (stays on this computer)
      <input id="apiKey" type="password" placeholder="sk-ant-…" autocomplete="off">
    </label>
    <label class="field">Claude model <input id="claudeModel" placeholder="claude-opus-5-5"></label>
    <div class="between"><p id="brainCheck">Not checked yet.</p><button class="btn" type="button" id="recheck">Check again</button></div>

    <h3>Voice</h3>
    <label class="field">Nour's voice <select id="voiceSel"></select></label>
    <div class="row2">
      <label class="field">Speed <input id="rate" type="range" min="0.7" max="1.4" step="0.05"></label>
      <label class="field">Language you speak <select id="hearLang"></select></label>
    </div>
    <div class="between"><p id="voiceNote">British voices are listed first.</p><button class="btn" type="button" id="testVoice">Test voice</button></div>

    <h3>Memory</h3>
    <p>Things Nour remembers about you. Saved only in this browser.</p>
    <ul class="facts" id="facts"></ul>
    <form class="between" id="addFact" style="flex-wrap:nowrap">
      <label class="field" style="flex:1">New memory <input id="factIn" placeholder="e.g. I'm learning Spanish (A2)"></label>
      <button class="btn primary" type="submit" style="align-self:end">Add</button>
    </form>
    <div class="between"><span></span><button class="btn danger" type="button" id="forgetAll">Forget everything</button></div>
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("nour." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("nour." + k, JSON.stringify(v)); } catch {} },
};

/* =====================  ORB  ===================== */
const cv = $("orb"), cx = cv.getContext("2d");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let DPR = 1;
function sizeOrb() { DPR = Math.min(devicePixelRatio || 1, 2); cv.width = cv.height = Math.round(cv.clientWidth * DPR); }
new ResizeObserver(sizeOrb).observe(cv); sizeOrb();
const rnd = (a, b) => a + Math.random() * (b - a);
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(...a); return a.map(x => x / l); };
const strands = Array.from({ length: 13 }, (_, i) => {
  const th = rnd(0, 6.283), ph = Math.acos(rnd(-1, 1));
  const n = [Math.sin(ph)*Math.cos(th), Math.cos(ph), Math.sin(ph)*Math.sin(th)];
  const u = norm(cross(n, Math.abs(n[0]) < .9 ? [1,0,0] : [0,1,0]));
  return { u, v: cross(n, u), k: 2 + i % 4, amp: rnd(.01, .045), ph: rnd(0, 6.28), spd: rnd(.4, 1.3), drift: rnd(-.25, .25), hue: rnd(262, 300), w: rnd(.6, 1.4) };
});
const mood = { name: "idle", energy: .35, target: .35, spin: .25, spinT: .25 };
function setMood(m) {
  const map = { idle: [.35, .25], listening: [.7, .5], thinking: [1, 1.1], speaking: [.85, .55] };
  [mood.target, mood.spinT] = map[m] || map.idle; mood.name = m;
}
let rot = 0, last = performance.now(), t = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
  mood.energy += (mood.target - mood.energy) * Math.min(1, dt * 3);
  mood.spin += (mood.spinT - mood.spin) * Math.min(1, dt * 2);
  rot += dt * mood.spin;
  const speak = mood.name === "speaking" ? .045 * Math.sin(t * 9) * Math.sin(t * 2.3) : 0;
  const breath = 1 + .015 * Math.sin(t * 1.6) + speak + (mood.name === "thinking" ? .01 * Math.sin(t * 14) : 0);
  const S = cv.width, c = S / 2, R = S * .3 * breath;
  cx.setTransform(1,0,0,1,0,0); cx.clearRect(0, 0, S, S); cx.globalCompositeOperation = "lighter";
  let g = cx.createRadialGradient(c, c, R*.7, c, c, R*1.62);
  g.addColorStop(0, `rgba(150,90,255,${.1 + .12*mood.energy})`); g.addColorStop(1, "rgba(80,30,160,0)");
  cx.fillStyle = g; cx.fillRect(0, 0, S, S);
  const nx = c + Math.cos(t*.5)*R*.25, ny = c + Math.sin(t*.37)*R*.2;
  g = cx.createRadialGradient(nx, ny, 0, nx, ny, R*.95);
  g.addColorStop(0, `rgba(90,60,230,${.22 + .18*mood.energy})`); g.addColorStop(.6, "rgba(120,40,200,.08)"); g.addColorStop(1, "rgba(0,0,0,0)");
  cx.fillStyle = g; cx.fillRect(0, 0, S, S);
  const ct = Math.cos(.35), st = Math.sin(.35), N = 120, CH = 12;
  for (const s of strands) {
    const pts = [], wob = s.amp * (.6 + mood.energy * 1.4), ro = rot * (1 + s.drift), c2 = Math.cos(ro), s2 = Math.sin(ro);
    for (let i = 0; i <= N; i++) {
      const a = i / N * 6.2832;
      const r = 1 + wob * Math.sin(s.k*a + s.ph + t*s.spd*(.5 + mood.energy)) + .03 * Math.sin(3*a - t*.7 + s.ph);
      let x = (Math.cos(a)*s.u[0] + Math.sin(a)*s.v[0]) * r, y = (Math.cos(a)*s.u[1] + Math.sin(a)*s.v[1]) * r, z = (Math.cos(a)*s.u[2] + Math.sin(a)*s.v[2]) * r;
      [x, z] = [x*c2 + z*s2, -x*s2 + z*c2]; [y, z] = [y*ct - z*st, y*st + z*ct];
      const p = 1 / (1 - z*.18);
      pts.push([c + x*R*p, c + y*R*p, z, Math.hypot(x, y)]);
    }

    <p>An AI can't fit inside one file, so Nour talks to a brain. Pick one. You only do this once.</p>
    <div class="opt">
      <strong>Option A · Free and private: Ollama on your Mac</strong>
      <ol>
        <li>Download and install Ollama from <code>ollama.com/download</code>, then open it.</li>
        <li>Open the Terminal app and paste these, one at a time:<br>
          <code>ollama pull llama3.2</code><br>
          <code>launchctl setenv OLLAMA_ORIGINS "*"</code></li>
        <li>Quit Ollama (menu bar icon → Quit) and open it again, then click <b>Check again</b>.</li>
      </ol>
      ${why === "nomodel" ? "<p>Ollama is running, but no model is downloaded yet. Run the first command above.</p>" : ""}
    </div>
    <div class="opt">
      <strong>Option B · Easiest: a Claude API key</strong>
      <p>Get a key at <code>platform.claude.com</code> (pay per use; a chat message costs a fraction of a cent to a few cents). Paste it here:</p>
      <div class="row"><input id="keyIn" type="password" placeholder="sk-ant-…" style="flex:1;min-width:0;background:var(--void);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink)"><button class="btn primary" type="button" id="keySave">Use this key</button></div>
    </div>
    <div class="row"><button class="btn" type="button" id="setupCheck">Check again</button></div>`;
  log.appendChild(d); setupCard = d;
  d.querySelector("#setupCheck").onclick = () => detectBrain();
  d.querySelector("#keySave").onclick = () => {
    const k = d.querySelector("#keyIn").value.trim();
    if (!/^sk-ant-/.test(k)) { d.querySelector("#keyIn").focus(); return; }
    cfg.apiKey = k; cfg.brain = cfg.brain === "ollama" ? "auto" : cfg.brain; saveCfg(); fillSettings(); detectBrain();
  };
}
function hideSetup() { setupCard?.remove(); setupCard = null; }

/* Each brain streams text through onText(fullTextSoFar). */
async function runOllama(turns, images, onText, signal) {
  const msgs = [{ role: "system", content: systemPrompt() }, ...turns.map((m, i) => {
    const o = { role: m.role, content: m.content };
    if (i === turns.length - 1 && images.length) o.images = images.map(a => a.b64);
    return o;
  })];
  const r = await fetch(cfg.ollamaUrl.replace(/\/$/, "") + "/api/chat", {
    method: "POST", signal, headers: { "content-type": "application/json" },
    body: JSON.stringify({ model: cfg.ollamaModel, messages: msgs, stream: true, options: { num_predict: smart ? 1024 : 400 } }),
  });
  if (!r.ok) throw new Error(r.status === 404 ? `Model "${cfg.ollamaModel}" isn't installed. Run: ollama pull ${cfg.ollamaModel}` : `Ollama error ${r.status}: ${(await r.text()).slice(0, 200)}`);
  const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "", text = "";
  for (;;) {
    const { done, value } = await rd.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split("\n"); buf = lines.pop();
    for (const line of lines) {
      if (!line.trim()) continue;
      const j = JSON.parse(line);
      if (j.error) throw new Error(j.error);
      if (j.message?.content) { text += j.message.content; onText(text); }
    }
  }
  return text;
}
async function runClaude(turns, images, onText, signal) {
  const messages = turns.map((m, i) => {
    if (i === turns.length - 1 && images.length) return { role: "user", content: [...images.map(a => ({ type: "image", source: { type: "base64", media_type: a.type, data: a.b64 } })), { type: "text", text: m.content }] };
    return { role: m.role, content: m.content };
  });
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST", signal,
    headers: {
      "content-type": "application/json",
      "x-api-key": cfg.apiKey.trim(),
      "anthropic-version": "2026-10-21",
      "anthropic-beta": "server-side-fallback-2026-07-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: cfg.claudeModel || "claude-opus-5-5",
      max_tokens: 16000,
      system: systemPrompt(),
      messages,
      stream: true,
      output_config: { effort: smart ? "high" : "low" },
      fallbacks: "default",
    }),
  });
  if (!r.ok) {
    let msg = `Claude API error ${r.status}`;
    try { const j = await r.json(); msg += ": " + (j.error?.message || ""); } catch {}
    if (r.status === 401) msg = "That Claude API key was refused. Check it in Settings.";
    if (r.status === 429) msg = "Claude is busy or your usage limit was reached. Try again in a moment.";
    throw new Error(msg);
  }
  const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "", text = "", refused = false;
  for (;;) {
    const { done, value } = await rd.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split("\n"); buf = lines.pop();
    for (const line of lines) {
      if (!line.startsWith("data:")) continue;
      let j; try { j = JSON.parse(line.slice(5)); } catch { continue; }
      if (j.type === "content_block_delta" && j.delta?.type === "text_delta") { text += j.delta.text; onText(text); }
      else if (j.type === "message_delta" && j.delta?.stop_reason === "refusal") refused = true;
      else if (j.type === "error") throw new Error(j.error?.message || "Claude stream error");
    }
  }
  if (refused && !text.trim()) text = "I'm afraid I can't help with that one, sir.";
  return text;
}
let chromeSession = null, chromeKey = "";
async function runChrome(turns, images, onText, signal) {
  const key = systemPrompt();
  if (!chromeSession || chromeKey !== key) {
    chromeSession?.destroy?.();
    chromeSession = await LanguageModel.create({ initialPrompts: [{ role: "system", content: key }, ...turns.slice(0, -1).map(m => ({ role: m.role, content: m.content }))] });
    chromeKey = key;
  }
  const stream = chromeSession.promptStreaming(turns.at(-1).content, { signal });
  let text = "";
  for await (const chunk of stream) { text = chunk.startsWith(text) && text ? chunk : text + chunk; onText(text); }
  return text;
}

/* =====================  ASK  ===================== */
async function ask(raw) {
  let text = (raw || "").trim();
  if (busy) return;
  const files = attachments;
  if (!text && !files.length) return;
  if (!text) text = MODES[mode].ask;
  if (!brain) { await detectBrain(); if (!brain) { note("Nour needs a brain first. Follow the steps in the box below."); return; } }
  attachments = []; renderTray(); q.value = ""; autosize();
  const images = files.filter(a => a.kind === "image"), docs = files.filter(a => a.kind === "text");
  if (images.length && brain.kind === "chrome") note("Chrome's built-in AI can't see photos; sending the text only.");
  const you = bubble("you", "");
  if (images.length) { const p = document.createElement("div"); p.className = "pics"; for (const a of images) { const im = new Image(); im.src = a.url; im.alt = "Your photo"; p.append(im); } you.append(p); }
  you.append(document.createTextNode(text));
  for (const d of docs) { const n = document.createElement("span"); n.className = "note"; n.textContent = "📄 " + d.name; you.append(n); }
  const stored = text + (files.length ? `\n(attached: ${files.map(f => f.kind === "image" ? "photo" : f.name).join(", ")})` : "");
  history.push({ role: "user", text: stored }); save();
  const content = text + docs.map(d => `\n\n[File: ${d.name}]\n${d.text}`).join("") + (images.length ? `\n(The user attached ${images.length} photo${images.length > 1 ? "s" : ""}.)` : "");
  const turns = history.slice(-10).map((m, i, arr) => ({ role: m.role, content: i === arr.length - 1 ? content : m.text }));
  while (turns.length && turns[0].role !== "user") turns.shift();

  busy = true; stopVoice(); setMood("thinking"); status(smart ? "Thinking deeply" : "Thinking", true);
  const out = bubble("ai", "…");
  let spokenUpTo = 0;
  const speakNew = (full, final) => {
    if (!cfg.speak) return;
    const v = visible(full), rest = v.slice(spokenUpTo);
    const m = final ? (rest.trim() ? [rest] : null) : rest.match(/^[\s\S]*?[.!?…。？！:\n](?=\s|$)/);
    if (m && (final || m[0].trim().length > 8)) { say(m[0]); spokenUpTo += m[0].length; if (!final) speakNew(full, false); }
  };
  ctl = new AbortController();
  try {
    const run = brain.kind === "ollama" ? runOllama : brain.kind === "claude" ? runClaude : runChrome;
    const reply = await run(turns, images, full => { out.textContent = visible(full) || "…"; log.scrollTop = log.scrollHeight; speakNew(full, false); }, ctl.signal);
    const clean = visible(reply) || "(no answer)";
    out.textContent = clean;
    speakNew(reply, true);
    const notes = [];
    for (const [, kind, val] of reply.matchAll(TAG)) {
      if (kind.toLowerCase() === "remember" && remember(val)) notes.push("Noted: " + val);
      if (kind.toLowerCase() === "forget" && forget(val)) notes.push("Forgotten: " + val);
    }
    if (notes.length) { saveFacts(); for (const n of notes) { const s = document.createElement("span"); s.className = "mem"; s.textContent = "◆ " + n; out.append(s); } }
    history.push({ role: "assistant", text: clean }); save();
  } catch (e) {
    if (e.name === "AbortError") out.textContent = out.textContent === "…" ? "(stopped)" : out.textContent;
    else {
      out.classList.add("err");
      out.textContent = (e.message || "Something went wrong.") + (brain.kind === "ollama" && /fetch/i.test(e.message) ? " Is Ollama still running?" : "");
      history.pop(); save();
    }
  } finally {
    busy = false; ctl = null;
    if (!synth || !(synth.speaking || synth.pending)) { resumeEars(); rest(); }
  }
}
$("bar").addEventListener("submit", e => { e.preventDefault(); unlockVoice(); if (busy) { ctl?.abort(); return; } ask(q.value); });
q.addEventListener("keydown", e => { unlockVoice(); if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(q.value); } });
q.addEventListener("input", autosize);

/* =====================  SETTINGS  ===================== */
function fillSettings() {
  $("brainSel").value = cfg.brain; $("ollamaUrl").value = cfg.ollamaUrl; $("apiKey").value = cfg.apiKey;
  $("claudeModel").value = cfg.claudeModel; $("rate").value = cfg.rate; $("voiceSel").value = cfg.voice; $("hearLang").value = cfg.hearLang;
  renderOllamaModels();
}
$("openSettings").onclick = () => { fillSettings(); confirmForget = false; $("forgetAll").textContent = "Forget everything"; $("sheet").hidden = false; };
$("closeSettings").onclick = () => { $("sheet").hidden = true; detectBrain(); };
$("sheet").addEventListener("click", e => { if (e.target.id === "sheet") $("closeSettings").click(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) $("closeSettings").click(); });
$("brainSel").onchange = e => { cfg.brain = e.target.value; saveCfg(); detectBrain(); };
$("ollamaUrl").onchange = e => { cfg.ollamaUrl = e.target.value.trim() || "http://localhost:11434"; saveCfg(); detectBrain(); };
$("ollamaModel").onchange = e => { cfg.ollamaModel = e.target.value; saveCfg(); detectBrain(); };
$("apiKey").onchange = e => { cfg.apiKey = e.target.value.trim(); saveCfg(); detectBrain(); };
$("claudeModel").onchange = e => { cfg.claudeModel = e.target.value.trim() || "claude-opus-5-5"; saveCfg(); };
$("recheck").onclick = () => detectBrain();

/* =====================  START  ===================== */
renderHistory(); renderMode(); renderSpeed(); renderFacts(); renderSpeaker(); renderHands(); fillSettings();
status("Starting…");
detectBrain();
</script>
