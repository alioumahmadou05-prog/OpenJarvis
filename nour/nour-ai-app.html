<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nour AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Monochrome: black, white, hairlines. The particle sphere is the only light source. */
:root {
  --bg: #000; --panel: rgba(255,255,255,.035); --panel2: rgba(255,255,255,.06); --line: rgba(255,255,255,.12); --line2: rgba(255,255,255,.22);
  --ink: #f2f2f2; --dim: #8d8d8d; --faint: #5a5a5a; --good: #3ddc84; --bad: #ff6b6b; --warn: #f5c451;
  --font: "Inter", system-ui, -apple-system, sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
:focus-visible { outline: 1.5px solid #fff; outline-offset: 2px; }
.mono { font-family: var(--mono); } .dim { color: var(--dim); }
#bgwave { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: 34vh; pointer-events: none; opacity: .9; }

.app { position: relative; display: grid; grid-template-columns: 250px minmax(0,1fr); height: 100%; }
/* ---------- sidebar ---------- */
.side { border-right: 1px solid var(--line); padding: 22px 16px; display: flex; flex-direction: column; gap: 22px; min-height: 0; background: rgba(0,0,0,.55); backdrop-filter: blur(6px); z-index: 2; }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 6px; }
.brand canvas { width: 50px; height: 50px; border-radius: 50%; }
.brand b { display: block; font-size: 20px; font-weight: 500; letter-spacing: .06em; }
.brand span { color: var(--dim); font-size: 13px; }
.nav { display: grid; gap: 4px; }
.nav button { display: flex; align-items: center; gap: 14px; padding: 11px 16px; border-radius: 14px; color: #d8d8d8; text-align: left; font-size: 15px; border: 1px solid transparent; }
.nav button svg { width: 20px; height: 20px; flex: none; }
.nav button:hover { background: var(--panel); }
.nav button[aria-current="page"] { border-color: var(--line2); background: var(--panel2); color: #fff; }
.profile { margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 10px 6px; border-top: 1px solid var(--line); text-align: left; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: #1a1a1a; border: 1px solid var(--line2); display: grid; place-items: center; font-weight: 500; flex: none; }
.profile b { display: block; font-weight: 500; font-size: 13.5px; } .profile span { color: var(--dim); font-size: 12px; }

/* ---------- main ---------- */
.main { position: relative; min-width: 0; display: grid; grid-template-rows: auto minmax(0,1fr); min-height: 0; z-index: 1; }
.top { display: flex; align-items: center; gap: 16px; padding: 18px 28px; }
.top .when { color: #cfcfcf; font-size: 14px; } .top .when i { color: var(--faint); font-style: normal; margin: 0 10px; }
.top .grow { flex: 1; }
.iconbtn { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: #d0d0d0; position: relative; }
.iconbtn:hover { background: var(--panel2); }
.iconbtn svg { width: 20px; height: 20px; }
.badge { position: absolute; top: 6px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: #fff; }
.burger { display: none; }
.page { min-height: 0; overflow-y: auto; padding: 0 28px 120px; scrollbar-width: thin; scrollbar-color: #333 transparent; }

/* ---------- home ---------- */
.home { display: grid; grid-template-columns: minmax(0,1fr) 250px; gap: 24px; min-height: 100%; }
.center { display: flex; flex-direction: column; align-items: center; min-width: 0; padding-top: 4px; }
.orbwrap { position: relative; width: min(420px, 60vh, 80vw); aspect-ratio: 1; cursor: pointer; }
.orbwrap canvas { width: 100%; height: 100%; display: block; }
.title { margin: 2px 0 0; font-weight: 300; font-size: clamp(30px, 3.6vw, 40px); letter-spacing: .55em; padding-left: .55em; text-align: center; }
.subtitle { color: #b5b5b5; font-size: 17px; margin-top: 6px; letter-spacing: .02em; }
#wave { width: min(260px, 70vw); height: 46px; margin: 10px 0 4px; }
.state { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); min-height: 1.4em; }
.reply { width: min(620px, 100%); margin: 10px 0 0; color: #e6e6e6; font-size: 15px; text-align: center; min-height: 1.5em; white-space: pre-wrap; max-height: 9.5em; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent); mask-image: linear-gradient(to bottom, #000 70%, transparent); }
.reply.you { color: var(--dim); font-style: italic; }
.askbar { width: min(540px, 100%); display: flex; align-items: center; gap: 8px; border: 1px solid var(--line2); border-radius: 999px; padding: 6px; margin-top: 14px; background: rgba(0,0,0,.6); backdrop-filter: blur(6px); }
.askbar input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; padding: 8px 6px; font-size: 15px; }
.askbar input::placeholder { color: #8a8a8a; }
.circle { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line2); display: grid; place-items: center; flex: none; color: #ddd; }
.circle svg { width: 18px; height: 18px; }
.circle:hover { background: var(--panel2); }
.circle.live { background: #fff; color: #000; border-color: #fff; box-shadow: 0 0 0 6px rgba(255,255,255,.1); }
.quick { display: grid; grid-template-columns: repeat(5, 120px); gap: 14px; margin-top: 22px; }
.qa { border: 1px solid var(--line); border-radius: 18px; padding: 16px 8px 14px; display: grid; justify-items: center; gap: 8px; background: rgba(0,0,0,.55); backdrop-filter: blur(6px); color: #e8e8e8; font-size: 13.5px; line-height: 1.25; text-align: center; }
.qa svg { width: 28px; height: 28px; stroke-width: 1.4; }
.qa:hover { border-color: var(--line2); background: rgba(255,255,255,.05); }
.widgets { display: grid; align-content: start; gap: 16px; padding-top: 4px; }
.card { border: 1px solid var(--line); border-radius: 20px; padding: 16px; background: rgba(0,0,0,.55); backdrop-filter: blur(6px); min-width: 0; }
.card h3 { margin: 0 0 12px; font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 10px; }
.card h3 svg { width: 18px; height: 18px; }
.card h3 .more { margin-left: auto; color: var(--dim); }
.rings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
.ring { position: relative; width: 56px; height: 56px; margin: 0 auto 6px; }
.ring svg { width: 56px; height: 56px; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-weight: 500; }
.rings span { color: var(--dim); font-size: 12px; }
.mkt { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 14px; }
.up { color: var(--good); } .down { color: var(--bad); }
.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.tasks li { display: flex; align-items: center; gap: 12px; font-size: 14px; }
.tasks input[type=checkbox] { appearance: none; width: 18px; height: 18px; border: 1.5px solid #8a8a8a; border-radius: 5px; flex: none; display: grid; place-items: center; }
.tasks input[type=checkbox]:checked { background: #fff; border-color: #fff; }
.tasks input[type=checkbox]:checked::after { content: "✓"; color: #000; font-size: 12px; font-weight: 700; }
.tasks li.done span { color: var(--faint); text-decoration: line-through; }
.tasks small { margin-left: auto; color: var(--dim); font-family: var(--mono); font-size: 11px; }
.addtask { width: 100%; margin-top: 14px; border: 1px solid var(--line); border-radius: 12px; padding: 9px; color: #e0e0e0; background: rgba(255,255,255,.03); }
.addtask:hover { border-color: var(--line2); }
.fab { position: fixed; right: 32px; bottom: 32px; width: 58px; height: 58px; border-radius: 50%; border: 1px solid var(--line2); display: grid; place-items: center; background: rgba(0,0,0,.7); z-index: 5; }
.fab svg { width: 24px; height: 24px; }

/* ---------- other pages ---------- */
.ph { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin: 6px 0 18px; }
.ph h1 { margin: 0; font-weight: 400; font-size: 26px; letter-spacing: .02em; }
.ph p { margin: 4px 0 0; color: var(--dim); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
.btn { border: 1px solid var(--line2); border-radius: 12px; padding: 9px 14px; color: #eee; background: rgba(255,255,255,.04); font-size: 14px; }
.btn:hover { background: rgba(255,255,255,.09); }
.btn.white { background: #fff; color: #000; border-color: #fff; font-weight: 500; }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 9px; }
.btn:disabled { opacity: .4; cursor: default; }
.field { display: grid; gap: 6px; font-size: 13px; color: var(--dim); }
.in { width: 100%; background: #0a0a0a; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; color: var(--ink); }
.in:focus { outline: none; border-color: var(--line2); }
textarea.in { resize: vertical; min-height: 90px; line-height: 1.5; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.note { color: var(--dim); font-size: 12.5px; }
.err { color: var(--bad); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; color: #ccc; font-size: 13px; }
.chip:hover, .chip[aria-pressed="true"] { border-color: #fff; color: #fff; }

/* chat */
.chatpage { display: grid; grid-template-columns: 230px minmax(0,1fr); gap: 16px; height: calc(100vh - 110px); min-height: 420px; }
.convlist { border: 1px solid var(--line); border-radius: 18px; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; background: rgba(0,0,0,.5); }
.convlist button.c { text-align: left; padding: 9px 10px; border-radius: 10px; color: #cfcfcf; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.convlist button.c:hover { background: var(--panel); } .convlist button.c[aria-current="true"] { background: var(--panel2); color: #fff; }
.convlist .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); padding: 10px 10px 2px; }
.chatbox { border: 1px solid var(--line); border-radius: 18px; display: grid; grid-template-rows: auto minmax(0,1fr) auto; min-height: 0; background: rgba(0,0,0,.5); }
.chathead { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.chathead b { font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 82%; min-width: 0; overflow-wrap: anywhere; line-height: 1.6; }
.msg.you { align-self: flex-end; background: #161616; border: 1px solid var(--line); padding: 9px 14px; border-radius: 18px 18px 4px 18px; white-space: pre-wrap; }
.msg.ai { align-self: flex-start; }
.msg.ai .who { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; color: var(--dim); margin-bottom: 2px; }
.msg.ai .body p { margin: 0 0 .6em; } .msg.ai .body p:last-child { margin: 0; }
.msg.ai .body ul, .msg.ai .body ol { margin: .2em 0 .6em; padding-left: 1.3em; }
.msg.ai .body code { font-family: var(--mono); background: #141414; border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; font-size: .9em; }
.msg.ai .body pre { background: #0d0d0d; border: 1px solid var(--line); border-radius: 10px; padding: 10px; overflow-x: auto; }
.msg .act { display: block; font-family: var(--mono); font-size: 11.5px; color: #cfcfcf; margin-top: 6px; }
.msg .srcs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.msg .srcs a { font-size: 12px; color: #cfcfcf; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; text-decoration: none; }
.msg img.att { max-width: 180px; border-radius: 12px; display: block; margin-bottom: 6px; }
.composer { display: flex; align-items: flex-end; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
.composer textarea { flex: 1; min-width: 0; resize: none; background: transparent; border: 0; outline: 0; padding: 9px 6px; max-height: 140px; }
.tray { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 12px; }
.tray span { border: 1px solid var(--line); border-radius: 10px; padding: 3px 8px; font-size: 12px; color: #ccc; display: inline-flex; gap: 6px; align-items: center; }

/* tools */
.calcout { font-family: var(--mono); font-size: 28px; text-align: right; padding: 8px 4px; min-height: 1.5em; overflow-x: auto; }
.keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.keys button { border: 1px solid var(--line); border-radius: 12px; padding: 12px 0; font-size: 16px; }
.keys button:hover { background: var(--panel2); }
#tv { height: 460px; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }

/* panels & modals */
.pop { position: fixed; z-index: 60; top: 70px; right: 24px; width: min(360px, calc(100% - 32px)); max-height: 70vh; overflow-y: auto; }
.modal { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: rgba(0,0,0,.78); backdrop-filter: blur(6px); padding: 16px; }
.modal .card { width: min(560px, 100%); max-height: 90vh; overflow-y: auto; display: grid; gap: 14px; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 80; background: #111; border: 1px solid var(--line2); border-radius: 14px; padding: 10px 16px; max-width: calc(100% - 32px); }

/* mobile */
.tabbar { display: none; }
@media (max-width: 1180px) { .home { grid-template-columns: minmax(0,1fr); } .widgets { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); } }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0,1fr); }
  .side { position: fixed; inset: 0 auto 0 0; width: 270px; transform: translateX(-100%); transition: transform .25s; z-index: 50; background: #000; }
  .side.open { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.6); }
  .burger { display: grid; }
  .top { padding: 14px 16px; padding-top: max(14px, env(safe-area-inset-top)); }
  .top .when { display: none; }
  .mbrand { display: flex !important; align-items: center; gap: 10px; }
  .mbrand canvas { width: 36px; height: 36px; }
  .page { padding: 0 16px 110px; }
  .quick { grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
  .quick .qa:nth-child(5) { display: none; }
  .qa { padding: 12px 4px; font-size: 12.5px; }
  .fab { display: none; }
  .tabbar { display: flex; position: fixed; left: 16px; right: 16px; bottom: max(14px, env(safe-area-inset-bottom)); z-index: 40; justify-content: space-around; border: 1px solid var(--line2); border-radius: 26px; padding: 8px; background: rgba(0,0,0,.85); backdrop-filter: blur(8px); }
  .tabbar button { width: 64px; height: 44px; border-radius: 18px; display: grid; place-items: center; color: #cfcfcf; }
  .tabbar button[aria-current="page"] { background: #fff; color: #000; }
  .tabbar svg { width: 22px; height: 22px; }
  .grid2, .grid3 { grid-template-columns: minmax(0,1fr); }
  .chatpage { grid-template-columns: minmax(0,1fr); height: calc(100vh - 170px); }
  .convlist { display: none; }
  .orbwrap { width: min(260px, 64vw); }
  .subtitle { font-size: 15px; }
}
.mbrand { display: none; }
.mbrand b { font-size: 16px; font-weight: 500; letter-spacing: .06em; display: block; } .mbrand span { color: var(--dim); font-size: 11px; }
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }
</style>
</head>
<body>
<canvas id="bgwave" aria-hidden="true"></canvas>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand"><canvas id="logo1" aria-hidden="true"></canvas><div><b>NOUR</b><span>Nour AI</span></div></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <button class="profile" id="profileBtn" type="button"><span class="avatar" id="avatar">N</span><span style="min-width:0;flex:1"><b id="pName">Your name</b><span id="pPlan">Personal</span></span><span class="dim">›</span></button>
  </aside>
  <div class="main">
    <header class="top">
      <button class="iconbtn burger" id="burger" aria-label="Open menu" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="mbrand"><canvas id="logo2" aria-hidden="true"></canvas><div><b>NOUR AI</b><span>Your AI Assistant</span></div></div>
      <div class="when mono" id="clock"></div>
      <div class="grow"></div>
      <button class="iconbtn" id="bell" aria-label="Notifications" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="badge" id="bellBadge" hidden></span></button>
      <button class="iconbtn" id="fullBtn" aria-label="Full screen" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </header>
    <div class="page" id="page"></div>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Quick navigation"></nav>
<button class="fab" id="fab" aria-label="Open chat" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h7M8.5 14.5h4"/></svg></button>
<div id="pop" class="card pop" hidden></div>
<div id="modal" class="modal" hidden><div class="card" id="modalCard" role="dialog" aria-modal="true"></div></div>
<input type="file" id="fileIn" multiple hidden accept="image/*,.txt,.md,.csv,.json,.srt,.py,.js,.html,text/plain">

<script>
"use strict";
/* =============================================================== utilities */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("nourai." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("nourai." + k, JSON.stringify(v)); } catch { toast("Browser storage is full or blocked."); } },
};
const uid = () => Math.random().toString(36).slice(2, 10);
let toastT;
function toast(t) { let el = $("#toast"); if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "toast"; el.setAttribute("role", "status"); document.body.append(el); } el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 4000); }
function md(text) {
  // tiny, safe markdown: code blocks, inline code, bold, italic, lists, links, paragraphs
  let h = esc(text);
  h = h.replace(/```([\s\S]*?)```/g, (_, c) => `<pre><code>${c.replace(/^\w*\n/, "")}</code></pre>`);
  h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>");
  h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  h = h.replace(/(^|\n)((?:\s*[-•*] .+(?:\n|$))+)/g, (_, a, list) => `${a}<ul>${list.trim().split(/\n/).map(l => `<li>${l.replace(/^\s*[-•*] /, "")}</li>`).join("")}</ul>`);
  h = h.replace(/(^|\n)((?:\s*\d+\. .+(?:\n|$))+)/g, (_, a, list) => `${a}<ol>${list.trim().split(/\n/).map(l => `<li>${l.replace(/^\s*\d+\. /, "")}</li>`).join("")}</ol>`);
  return h.split(/\n{2,}/).map(p => /^<(ul|ol|pre)/.test(p.trim()) ? p : `<p>${p.replace(/\n/g, "<br>")}</p>`).join("");
}
const ICON = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  chat: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"/>',
  tools: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
  academy: '<path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/>',

  const out = [];
  for (const [, kind, body] of text.matchAll(TAG)) {
    const f = body.split("|").map(x => x.trim());

      let due = null;
      if (f[1]) { const d = new Date(f[1]); if (!isNaN(d)) due = d.getTime(); }
      if (due && due < Date.now() - 60000) { out.push(`Couldn't add "${f[0]}": that time has passed.`); continue; }

/* =============================================================== Groq (brain, live web, vision, hearing) */
async function groqStream({ messages, model, onText, signal }) {
  const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST", signal,
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${cfg.groqKey}` },
    body: JSON.stringify({ model, messages, stream: true, temperature: .7, max_tokens: 2048 }),

  if (!r.ok) { let m = `Groq error ${r.status}`; try { m += ": " + (await r.json()).error?.message; } catch {} if (r.status === 401) m = "Your Groq key was refused. Check it in Settings."; throw new Error(m); }

  for (;;) {
    const { done, value } = await rd.read(); if (done) break;
    buf += dec.decode(value, { stream: true }); const lines = buf.split("\n"); buf = lines.pop();
    for (const l of lines) {
      if (!l.startsWith("data:")) continue; const d = l.slice(5).trim(); if (d === "[DONE]") continue;
      let j; try { j = JSON.parse(d); } catch { continue; }
      const delta = j.choices?.[0]?.delta;
      if (delta?.content) { text += delta.content; onText(text); }
      for (const tool of delta?.executed_tools || []) for (const res of tool.search_results?.results || []) sources.push({ title: res.title || res.url, url: res.url });
    }

}
async function transcribe(blob) {
  const fd = new FormData();
  fd.append("file", blob, "speech.webm"); fd.append("model", cfg.sttModel); fd.append("response_format", "json");
  const r = await fetch("https://api.groq.com/openai/v1/audio/transcriptions", { method: "POST", headers: { Authorization: `Bearer ${cfg.groqKey}` }, body: fd });
  if (!r.ok) throw new Error(`Transcription failed (${r.status})`);
  return ((await r.json()).text || "").trim();
}

function conv(id) { return convs.find(c => c.id === id); }
function newConv(mode = "general") { const c = { id: uid(), title: "New conversation", mode, updated: Date.now(), msgs: [] }; convs.unshift(c); saveConvs(); return c; }
let busy = false, ctl = null;
async function ask(text, { mode, source = "text", image = null, files = [], show = true } = {}) {
  text = (text || "").trim();
  if ((!text && !image && !files.length) || busy) return;
  if (!cfg.groqKey) { openSetup(); return; }
  let c = conv(current);
  if (!c || (mode && c.mode !== mode && c.msgs.length)) { c = newConv(mode || "general"); current = c.id; }
  if (mode) c.mode = mode;
  const fileText = files.map(f => `\n\n[File: ${f.name}]\n${f.text}`).join("");
  c.msgs.push({ role: "user", content: text || "What is in this image?", image: image?.url || null, files: files.map(f => f.name), source });
  if (c.title === "New conversation") c.title = (text || "Image").slice(0, 60);
  c.updated = Date.now(); saveConvs();
  const reply = { role: "assistant", content: "", sources: [], actions: [] }; c.msgs.push(reply);
  setCaption(text, "you"); renderChat();
  busy = true; voice.stop(); voice.setState("thinking");
  const live = !image && (c.mode === "trading" || LIVE.test(text));
  const model = image ? cfg.visionModel : live ? cfg.webModel : cfg.chatModel;
  const history = c.msgs.slice(0, -2).slice(-12).map(m => ({ role: m.role, content: m.content }));
  const user = image
    ? { role: "user", content: [{ type: "text", text: (text || "Describe this image.") + fileText }, { type: "image_url", image_url: { url: image.url } }] }
    : { role: "user", content: text + fileText };
  const extra = live ? "You have live web search for this answer: use it, cite sources with dates, and say clearly if information may be outdated." : "";
  let spokenLen = 0;
  const speakNew = (vis, final) => {
    const chunk = vis.slice(spokenLen); let m, consumed = 0, rest = chunk;
    while ((m = rest.match(/^([\s\S]*?[.!?…。？！\n])(?=\s|$)/))) { if (m[1].trim().length > 2) voice.say(m[1].trim()); consumed += m[0].length; rest = rest.slice(m[0].length); }
    if (final && rest.trim()) { voice.say(rest.trim()); consumed += rest.length; }
    spokenLen += consumed;
  };
  const speak = store.get("speak", true);
  ctl = new AbortController();
  try {
    let res;
    try { res = await groqStream({ messages: [{ role: "system", content: persona(c.mode, extra) }, ...history, user], model, signal: ctl.signal, onText: t => { reply.content = visible(t); setCaption(reply.content, "nour"); updateLastBubble(reply); if (speak) speakNew(reply.content, false); } }); }
    catch (e) { if (live && e.name !== "AbortError") { res = await groqStream({ messages: [{ role: "system", content: persona(c.mode, "Live search is unavailable right now: say you can't check live information.") }, ...history, user], model: cfg.chatModel, signal: ctl.signal, onText: t => { reply.content = visible(t); setCaption(reply.content, "nour"); updateLastBubble(reply); if (speak) speakNew(reply.content, false); } }); } else throw e; }
    reply.content = visible(res.text) || "(no answer)";
    reply.sources = res.sources.filter((s, i, a) => s.url && a.findIndex(x => x.url === s.url) === i).slice(0, 8);
    reply.actions = applyActions(res.text);
    if (speak) speakNew(reply.content, true);
    setCaption(reply.content, "nour");
  } catch (e) {
    reply.content = e.name === "AbortError" ? (reply.content || "(stopped)") : `I couldn't answer: ${e.message}`; reply.error = e.name !== "AbortError";
  } finally {
    busy = false; ctl = null; c.updated = Date.now(); saveConvs(); renderChat();
    if (!voice.speaking) voice.setState(voice.active ? "listening" : "idle");
  }
}
function setCaption(text, who) { const el = $("#reply"); if (!el) return; const t = (text || "").trim(); el.textContent = who === "you" ? (t ? `“${t}”` : "") : t; el.classList.toggle("you", who === "you"); }

async function renderRings() {
  const el = $("#rings"); if (!el) return;
  const ring = (pct, label, txt) => { const v = Math.max(0, Math.min(100, pct ?? 0)), C = 2 * Math.PI * 24; return `<div><div class="ring"><svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="24" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="3"/><circle cx="28" cy="28" r="24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - v / 100)}"/></svg><b>${txt}</b></div><span>${label}</span></div>`; };
  let bat = null; try { const b = await navigator.getBattery?.(); if (b) bat = Math.round(b.level * 100); } catch {}
  let quota = null; try { const s = await navigator.storage?.estimate?.(); if (s?.quota) quota = s.usage / s.quota * 100; } catch {}
  let ping = null; if (cfg.groqKey) { const t0 = performance.now(); try { await fetch("https://api.groq.com/openai/v1/models", { headers: { Authorization: `Bearer ${cfg.groqKey}` } }); ping = Math.round(performance.now() - t0); } catch {} }
  if (!$("#rings")) return;
  $("#rings").innerHTML = ring(bat, "Battery", bat == null ? "—" : bat + "%") + ring(ping == null ? 0 : Math.max(5, 100 - ping / 10), "AI latency", ping == null ? (navigator.onLine ? "—" : "off") : ping + "ms") + ring(quota, "App storage", quota == null ? "—" : quota < 1 ? "<1%" : Math.round(quota) + "%");
}
let gold = store.get("gold", null);
async function fetchGold() {
  try { const r = await fetch("https://api.gold-api.com/price/XAU"); const j = await r.json(); if (!j.price) throw 0; const prev = gold; gold = { price: +j.price, at: Date.now(), open: (prev && new Date(prev.at).toDateString() === new Date().toDateString()) ? prev.open : +j.price }; store.set("gold", gold); }
  catch { if (gold) gold.stale = true; }
  renderMarket();
}
function renderMarket() {
  const el = $("#mkt"); if (!el) return;

}

  el.innerHTML = list.length ? list.map(t => `<li class="${t.done ? "done" : ""}"><input type="checkbox" data-t="${t.id}" ${t.done ? "checked" : ""} aria-label="Done: ${esc(t.text)}"><span>${esc(t.text)}</span>${t.due ? `<small>${new Date(t.due).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</small>` : ""}</li>`).join("") : `<li class="dim">No tasks. Say “Nour, remind me to…”</li>`;
  $$("[data-t]", el).forEach(cb => cb.onchange = () => { const t = tasks.find(x => x.id === cb.dataset.t); if (t) { t.done = cb.checked; saveTasks(); renderTasks(); } });
}

  const p = $("#tPerm"); if (p) p.onclick = () => Notification.requestPermission().then(() => openTasks());
  $("#mClose").onclick = closeModal;
}
setInterval(() => {
  const now = Date.now(); let changed = false;
  for (const t of tasks) if (!t.done && t.due && !t.notified && t.due <= now) {
    t.notified = true; changed = true;
    notify("Reminder", t.text);
    if (store.get("speak", true)) voice.say(`Reminder: ${t.text}`);
  }
  if (changed) { saveTasks(); renderTasks(); }
}, 15000);

  notices.unshift({ id: uid(), title, body, at: Date.now(), read: false }); saveNotices(); $("#bellBadge").hidden = false; toast(`${title}: ${body}`);
  if ("Notification" in window && Notification.permission === "granted") new Notification(title, { body });
}

function updateLastBubble(m) { const log = $("#log"); if (!log) return; const last = log.lastElementChild; if (last && last.classList.contains("ai")) { last.outerHTML = bubbleHTML(m); log.scrollTop = log.scrollHeight; } else renderChat(); }
function pickFiles(cb) {
  const inp = $("#fileIn"); inp.value = "";
  inp.onchange = async () => {
    const out = [];
    for (const f of inp.files) {
      if (f.type.startsWith("image/")) { const url = await shrink(f); if (url) out.push({ name: f.name, image: true, url }); }
      else out.push({ name: f.name, text: (await f.text()).slice(0, 40000) });
    }
    cb(out);
  };
  inp.click();
}
async function shrink(file) { try { const bmp = await createImageBitmap(file), k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height)); const c = document.createElement("canvas"); c.width = bmp.width * k; c.height = bmp.height * k; c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height); return c.toDataURL("image/jpeg", .85); } catch { return null; } }
function attachToComposer(files) { attachments.push(...files); renderTray(); }
function renderTray() { const t = $("#tray"); if (!t) return; t.innerHTML = attachments.map((a, i) => `<span>${a.image ? "🖼" : "📄"} ${esc(a.name)} <button data-rm="${i}" aria-label="Remove">✕</button></span>`).join(""); $$("[data-rm]", t).forEach(b => b.onclick = () => { attachments.splice(+b.dataset.rm, 1); renderTray(); }); }

const UNITS = {
  length: { m: 1, km: 1000, cm: .01, mm: .001, mi: 1609.344, ft: .3048, in: .0254 },
  mass: { kg: 1, g: .001, lb: .45359237, t: 1000, oz: .028349523 },
  pressure: { Pa: 1, kPa: 1000, bar: 1e5, atm: 101325, psi: 6894.757, mmHg: 133.322 },
  energy: { J: 1, kJ: 1000, cal: 4.184, kcal: 4184, kWh: 3.6e6, BTU: 1055.056 },
  temperature: { "°C": 1, "°F": 1, K: 1 },
  volume: { L: 1, mL: .001, "m³": 1000, gal: 3.785411784 },
};
function temp(v, f, t) { const c = f === "°C" ? v : f === "°F" ? (v - 32) * 5 / 9 : v - 273.15; return t === "°C" ? c : t === "°F" ? c * 9 / 5 + 32 : c + 273.15; }
function calc(expr) {
  const e = String(expr).replace(/\^/g, "**").replace(/π/g, "pi").replace(/×/g, "*").replace(/÷/g, "/");
  if (!/^[\d\s+\-*/().,%a-z]*$/i.test(e)) throw new Error("bad");
  const words = e.match(/[a-z]+/gi) || [];
  if (words.some(w => !["sin", "cos", "tan", "sqrt", "log", "ln", "abs", "pi", "e", "exp", "asin", "acos", "atan"].includes(w.toLowerCase()))) throw new Error("bad");
  const js = e.replace(/\bln\b/gi, "Math.log").replace(/\blog\b/gi, "Math.log10").replace(/\b(sin|cos|tan|sqrt|abs|exp|asin|acos|atan)\b/gi, "Math.$1").replace(/\bpi\b/gi, "Math.PI").replace(/\be\b/g, "Math.E").replace(/(\d)%/g, "($1/100)");
  return Function(`"use strict";return (${js || 0})`)();
}

  $("#sSave").onclick = () => { cfg.groqKey = $("#sGroq").value.trim(); cfg.fishKey = $("#sFish").value.trim(); voice.fishFailed = false; saveCfg(); $("#sMsg").textContent = "Saved."; renderRings(); };
  $("#sTest").onclick = () => { voice.fishFailed = false; voice.stop(); voice.say("Good evening. Nour here, as modest as ever."); };
  const mem = () => { $("#sMem").innerHTML = memories.length ? memories.map(m => `<div class="row" style="justify-content:space-between"><span>${esc(m.text)}</span><button class="btn sm" data-m="${m.id}">✕</button></div>`).join("") : '<p class="note" style="margin:0">Nothing yet. Tell Nour about yourself.</p>'; $$("[data-m]").forEach(b => b.onclick = () => { memories = memories.filter(x => x.id !== b.dataset.m); saveMem(); mem(); }); };
  mem(); $("#sMemForm").onsubmit = e => { e.preventDefault(); const t = $("#sMemIn").value.trim(); if (t) { memories.push({ id: uid(), text: t, at: Date.now() }); saveMem(); $("#sMemIn").value = ""; mem(); } };
  $("#sExport").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify({ convs, tasks, memories, notices }, null, 2)], { type: "application/json" })); a.download = "nour-ai-data.json"; a.click(); };
  let armed = false; $("#sWipe").onclick = () => { if (!armed) { armed = true; $("#sWipe").textContent = "Click again to delete everything"; return; } Object.keys(localStorage).filter(k => k.startsWith("nourai.")).forEach(k => localStorage.removeItem(k)); location.reload(); };
}

/* =============================================================== setup & modal */
function modal(html) { $("#modalCard").innerHTML = html; $("#modal").hidden = false; }
function closeModal() { $("#modal").hidden = true; }
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeModal(); $("#pop").hidden = true; } });
function openSetup() {
  modal(`<h2 style="margin:0;font-weight:400;letter-spacing:.2em">NOUR AI</h2><p class="dim" style="margin:0">Paste your keys once. They stay in this browser on your Mac.</p>
    <label class="field">Your name<input class="in" id="uName" value="${esc(cfg.name)}" placeholder="What should Nour call you?"></label>
    <label class="field">Groq API key (brain, hearing, live web) · console.groq.com<input class="in mono" id="uGroq" type="password" value="${esc(cfg.groqKey)}" placeholder="gsk_…" autocomplete="off"></label>
    <label class="field">Fish Audio API key (natural voice, optional) · fish.audio<input class="in mono" id="uFish" type="password" value="${esc(cfg.fishKey)}" autocomplete="off"></label>
    <p class="note" style="margin:0">Keys pasted into a chat or message should be regenerated first. Without a Fish key, Nour uses your Mac's voice.</p>
    <div id="uMsg" class="note"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" id="uLater">Later</button><button class="btn white" id="uGo">Start Nour</button></div>`);
  $("#uLater").onclick = closeModal;
  $("#uGo").onclick = () => {
    const g = $("#uGroq").value.trim();
    if (!/^gsk_/.test(g)) { $("#uMsg").innerHTML = '<span class="err">A Groq key starts with gsk_.</span>'; return; }
    Object.assign(cfg, { groqKey: g, fishKey: $("#uFish").value.trim(), name: $("#uName").value.trim(), setupDone: true }); saveCfg(); renderProfile(); closeModal(); renderRings();
    voice.say(`Good ${new Date().getHours() < 12 ? "morning" : new Date().getHours() < 18 ? "afternoon" : "evening"}${cfg.name ? ", " + cfg.name : ""}. Nour online. Try not to bore me.`);
  };
}

/* =============================================================== start */
renderProfile();
go("home");
if (!cfg.groqKey) setTimeout(openSetup, 400);
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => page === "settings" && renderSettings();
</script>
</body>
</html>
